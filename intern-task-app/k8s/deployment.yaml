apiVersion: apps/v1
kind: Deployment
metadata:
  name: intern-task-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intern-task-app
  template:
    metadata:
      labels:
        app: intern-task-app
    spec:
      containers:
        - name: intern-task-app
          image: intern-task-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
